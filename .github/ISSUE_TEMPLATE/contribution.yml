name: Contribution / task
description: Propose work aligned with PROJECT_STATUS
title: "[task] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Read [CONTRIBUTING.md](../../CONTRIBUTING.md) and [docs/PROJECT_STATUS.md](../../docs/PROJECT_STATUS.md) first.
        Before FFI changes: [docs/SETUP_GUIDE.md](../../docs/SETUP_GUIDE.md).
  - type: checkboxes
    id: ffi
    attributes:
      label: Touching high-risk FFI?
      options:
        - label: This work may touch wrdlHelper/ios/, rust_builder/, flutter_rust_bridge.yaml, or rust/src/api/
          required: false
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable checks (tests, commands)
    validations:
      required: true
